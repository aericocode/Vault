<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The window name (Settings › Stage), never a file name: Discord lists it. -->
  <title>Vault Stage</title>
  <link rel="stylesheet" href="./css/stage.css">
</head>
<body class="stage-body">
  <!-- Stage (PLAYLISTS_SPEC 5): only the media. The media area is a box of
       layers, not one element: the next file is laid in under the one
       playing and swapped in when it can play (and the Wall can go here). -->
  <div class="stage-media" id="stageMedia" aria-hidden="true"></div>
  <div class="stage-name" id="stageName" aria-hidden="true"></div>
  <!-- Hold, the end of the list, a lock: black over everything. -->
  <div class="stage-black on" id="stageBlack" aria-hidden="true"></div>
  <!-- Pop-up window only (never in the Stage window Vault opens itself). -->
  <button type="button" class="stage-fill" id="stageFill" hidden>Fill this screen</button>

  <!-- hls.js 1.7.2, Apache-2.0: see player-lib/THIRD-PARTY.txt -->
  <script src="./player-lib/hls.min.js"></script>
  <!-- codecCaps(): what this browser decodes, asked the same way as the player -->
  <script src="./player-lib/player/player-stream.js"></script>
  <script src="./player-lib/stage-rules.js"></script>
  <script src="./player-lib/stage.js"></script>
</body>
</html>
