<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault</title>
  
  <!-- Modular CSS -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/search.css">
  <link rel="stylesheet" href="./css/cards.css">
  <link rel="stylesheet" href="./css/modal.css">
  <link rel="stylesheet" href="./css/pagination.css">
  <link rel="stylesheet" href="./css/toast.css">
  <link rel="stylesheet" href="./css/extensions.css">
  <link rel="stylesheet" href="./css/notes.css">
  <link rel="stylesheet" href="./css/saved-searches.css">
  <link rel="stylesheet" href="./css/mini-player.css">
  <!-- The mini player as Stage's remote, its menu and tips (player-lib/stage-control.js) -->
  <link rel="stylesheet" href="./css/stage-remote.css">
  <link rel="stylesheet" href="./css/sidebar.css">
  <!-- Docked preview pane (Modern look), scoped under body.dock-shown -->
  <link rel="stylesheet" href="./css/dock.css">
  <!-- Left filter rail (Modern look), scoped under body.rail-shown -->
  <link rel="stylesheet" href="./css/filter-rail.css">
  <link rel="stylesheet" href="./css/detail-view.css">
  <link rel="stylesheet" href="./css/abloop.css">
  <link rel="stylesheet" href="./css/duplicates.css">
  <link rel="stylesheet" href="./css/tiles.css">
  <link rel="stylesheet" href="./css/player/player-base.css">
  <link rel="stylesheet" href="./css/player/player-controls.css">
  <link rel="stylesheet" href="./css/player/player-video.css">
  <link rel="stylesheet" href="./css/player/player-audio.css">
  <link rel="stylesheet" href="./css/player/player-image.css">
  <link rel="stylesheet" href="./css/player/player-document.css">
  <link rel="stylesheet" href="./css/player/player-info.css">
  <link rel="stylesheet" href="./css/player/subtitles.css">
  <link rel="stylesheet" href="./css/gamify.css">
  <link rel="stylesheet" href="./css/metadata-tools.css">
  <link rel="stylesheet" href="./css/beatbar.css">
  <link rel="stylesheet" href="./css/lovense.css">
  <link rel="stylesheet" href="./css/vault.css">
  <link rel="stylesheet" href="./css/import.css">
  <link rel="stylesheet" href="./css/music.css">
  <link rel="stylesheet" href="./css/editor.css">
  <link rel="stylesheet" href="./css/pmv.css">
  <link rel="stylesheet" href="./css/games.css">
  <link rel="stylesheet" href="./css/settings.css">
  <!-- The search box in the Settings menu (player-lib/settings-search.js) -->
  <link rel="stylesheet" href="./css/settings-search.css">
  <link rel="stylesheet" href="./css/tooltip.css">
  <link rel="stylesheet" href="./css/filter-chips.css">
  <link rel="stylesheet" href="./css/faces.css">
  <link rel="stylesheet" href="./css/faces-tab.css">
  <link rel="stylesheet" href="./css/faces-review.css">
  <link rel="stylesheet" href="./css/studios.css">
  <link rel="stylesheet" href="./css/wall.css">
  <!-- Folder watchers: Settings group, options dialog, activity pill, tile tags -->
  <link rel="stylesheet" href="./css/watchers.css">
  <!-- AI scan panel tabs (Progress / Failed / Waiting) and the Scanning settings group -->
  <link rel="stylesheet" href="./css/scan-panel.css">
  <!-- Modern library look: every rule is scoped under body.layout-modern -->
  <link rel="stylesheet" href="./css/layout-modern.css">
  <!-- The Modern look's line icons (player-lib/icons.js) -->
  <link rel="stylesheet" href="./css/icons.css">
  <!-- Table view (Modern look), scoped under .results-grid.grid-table -->
  <link rel="stylesheet" href="./css/table-view.css">
  <!-- The ? window and Settings > Keyboard shortcuts -->
  <link rel="stylesheet" href="./css/shortcuts.css">
  <!-- Modern Settings: cards, rows, grouped menu (body.layout-modern only) -->
  <link rel="stylesheet" href="./css/settings-modern.css">
  <!-- Modern player: bottom dock, song-segment timeline, auto-hide (body.layout-modern only) -->
  <link rel="stylesheet" href="./css/player/player-modern.css">
  <link rel="stylesheet" href="./css/player/player-panel-modern.css">
  <link rel="stylesheet" href="./css/up-next.css">
  <!-- Modern beat bar: glass lane and its settings (body.layout-modern only) -->
  <link rel="stylesheet" href="./css/beatbar-modern.css">
  <!-- In-app alert / confirm / prompt (player-lib/vault-dialogs.js), both looks -->
  <link rel="stylesheet" href="./css/dialogs.css">

  <link rel="icon" type="image/svg+xml" href="./images/favicon.svg">
</head>
<body>
  <!-- Main App (served by the local viewer server — library auto-loads) -->
  <header class="header" id="appHeader">
    <div class="header-content">
      <div class="logo" id="vaultLogo" title="Vault">
        <svg class="logo-lock" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path class="lock-shackle" d="M32 48 V38 C32 22 68 22 68 38 V48" fill="none" stroke="#1e1f22" stroke-width="11" stroke-linecap="round"/>
          <path class="lock-shackle" d="M32 48 V38 C32 22 68 22 68 38 V48" fill="none" style="stroke: var(--brand);" stroke-width="8" stroke-linecap="round"/>
          <rect x="22.5" y="44.5" width="55" height="45" rx="9" fill="#1e1f22"/>
          <rect x="24" y="46" width="52" height="42" rx="8" style="fill: var(--brand);"/>
          <path d="M36 58 L48 67 L36 76 Z" fill="#1e1f22"/>
          <path d="M52 58 L64 67 L52 76 Z" fill="#1e1f22"/>
        </svg>
        Vault
      </div>
      <nav class="app-tabs" id="appTabs">
        <button class="app-tab active" data-tab="library" onclick="switchTab('library')" aria-label="Library"><span class="app-tab-label"><span class="app-tab-ic" aria-hidden="true" data-vi="library">📚 </span><span class="app-tab-name">Library</span></span></button>
        <button class="app-tab" data-tab="collections" onclick="switchTab('collections')" aria-label="Collections"><span class="app-tab-label"><span class="app-tab-ic" aria-hidden="true" data-vi="folder">📁 </span><span class="app-tab-name">Collections</span></span></button>
        <button class="app-tab" data-tab="faces" onclick="switchTab('faces')" aria-label="Faces"><span class="app-tab-label"><span class="app-tab-ic" aria-hidden="true" data-vi="person">👤 </span><span class="app-tab-name">Faces</span></span></button>
        <button class="app-tab" data-tab="editor" onclick="switchTab('editor')" aria-label="Editor" aria-labelledby="editorTabName editorTabBadge"><span class="app-tab-label"><span class="app-tab-ic" aria-hidden="true" data-vi="editor">🎨 </span><span class="app-tab-name" id="editorTabName">Editor</span></span><span class="app-tab-badge" id="editorTabBadge" style="display:none;"></span></button>
        <button class="app-tab" data-tab="games" onclick="switchTab('games')" aria-label="Games"><span class="app-tab-label"><span class="app-tab-ic" aria-hidden="true" data-vi="games">🎮 </span><span class="app-tab-name">Games</span></span></button>
        <button class="app-tab" data-tab="wall" onclick="switchTab('wall')" aria-label="Wall"><span class="app-tab-label"><span class="app-tab-ic" aria-hidden="true" data-vi="wall">🧱 </span><span class="app-tab-name">Wall</span></span></button>
      </nav>
      <div class="db-info">
        <strong id="totalCount">Loading…</strong>
        <!-- Modern look: the count as short muted text with the database name in
             its tooltip (player-lib/header-fit.js keeps it in step with #totalCount) -->
        <span class="hdr-count modern-only" id="headerCountShort"></span>
      </div>
      <div class="header-buttons">
        <!-- Modern look: one Add button with a small menu. Its entries click the
             real Add files / Add folder buttons (importer.js), which Modern hides. -->
        <div class="hdr-add modern-only" id="hdrAdd">
          <button type="button" class="header-btn hdr-add-btn" id="hdrAddBtn" aria-haspopup="menu"
                  aria-expanded="false" aria-controls="hdrAddMenu" title="Add files or a folder to the library"><span class="vi-w" data-vi="plus">＋ </span>Add</button>
          <div class="hdr-add-menu" id="hdrAddMenu" role="menu" aria-label="Add to the library" hidden>
            <button type="button" class="hdr-add-item" role="menuitem" tabindex="-1" data-add-for="addFilesBtn" data-add-icon="file">Add files</button>
            <button type="button" class="hdr-add-item" role="menuitem" tabindex="-1" data-add-for="addFolderBtn" data-add-icon="folder">Add folder</button>
          </div>
        </div>
        <button class="header-btn refresh-btn" id="refreshBtn" title="Reload library from server">
          <span class="hb-text"><span class="hb-ic" data-vi="refresh">🔄 </span><span class="hb-label">Refresh</span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="main-container active" id="mainContainer">
    <!-- Search Section -->
    <section class="search-section">
      <div class="search-row">
        <div class="search-input-wrapper">
          <span class="search-icon" data-vi="search">🔍</span>
          <input type="text" class="search-input" id="searchInput" placeholder="Search files, tags, notes">
          <button class="search-clear-btn" id="searchClearBtn" onclick="clearSearchInput()" title="Clear search" style="display:none;">✕</button>
          <button class="search-save-star" id="searchSaveStar" onclick="saveSearchFromInput()" title="Save this search" style="display:none;">☆</button>
        </div>
        <!-- The four search modifiers live behind one button now (their
             checkboxes are still in #filterState, so every listener, saved
             search and session restore keeps working unchanged). -->
        <button type="button" class="fchip-btn" id="searchOptionsBtn"
                aria-haspopup="true" aria-expanded="false">Options ▾</button>
        <button class="clear-filters-btn" id="clearFiltersBtn" disabled>Clear filters</button>
      </div>

      <!-- One line under the search box, shown only when it has something to
           say: a search the server refused, the first-launch index build, or
           the close names and tags a fuzzy search also matched (filters.js
           renderSearchNote). -->
      <div class="search-note" id="searchNote" aria-live="polite" style="display:none;"></div>

      <!-- Media-type bubbles (+ safe toggle) with the extension chips collapsed behind them -->
      <div id="typeFilterContainer">
        <div class="media-type-bar" id="mediaTypeBar"></div>
        <div class="extension-bar" id="extensionBar" style="display:none;"></div>
        <div class="ext-legend" id="extensionLegend" style="display:none;">
          <span class="ext-playable">★</span> all play
          <span class="ext-playable part">★</span> some play
          <span class="ext-playable none">★</span> none play
          <span class="ext-legend-none">no star</span> not checked yet
        </div>
      </div>

      <!-- Filter chips: Rating / Duration / Language / Theme always, then one
           chip per other filter that is set, then More. Fixed min-height so
           setting or clearing a filter never moves the grid. -->
      <div class="filter-chip-row" id="filterChipRow"></div>

      <!-- Saved Searches Bar -->
      <div class="saved-searches-bar" id="savedSearchesBar"></div>

      <!-- Collections tab chrome: breadcrumb + New folder/collection + View all -->
      <div class="coll-tabbar" id="collectionsTabBar" style="display:none;"></div>

      <!-- Open-collection header strip (name, description, Play All / Shuffle / Export…) -->
      <div class="collections-bar" id="collectionsBar" style="display:none;"></div>
      <!-- Under the bar while a collection is open: how to rearrange it
           (player-lib/collection-reorder.js) -->
      <div class="coll-reorder-note" id="collReorderNote" hidden></div>

      <!-- The "More" sheet. Floats over the grid rather than sitting in the
           flow, so opening it never moves a single tile. Filled by
           player-lib/filter-chips.js. -->
      <div class="filters-panel" id="moreFiltersSheet" role="dialog" aria-label="More filters"></div>

      <!-- ── Filter state store ────────────────────────────────────────────
           Every control below is the SOURCE OF TRUTH for one filter, exactly
           as it was before round 6: applyFilters() reads these elements and
           saved searches serialize them. Round 6 only changed what the user
           sees. The chips and the More sheet write here and dispatch the same
           change events, so nothing downstream had to learn a new shape. -->
      <div id="filterState" hidden>
        <label><input type="checkbox" id="metadataOnly"> Metadata only</label>
        <label><input type="checkbox" id="fuzzySearch"> Fuzzy</label>
        <label><input type="checkbox" id="semanticSearch"> Semantic</label>
        <label><input type="checkbox" id="subtitleSearch"> Subtitles</label>

        <select id="filterContent"><option value="">All Content</option></select>
        <select id="filterLanguage"><option value="">All Languages</option></select>
        <select id="filterMinRating">
          <option value="0">Any</option>
          <option value="unrated">Unrated</option>
          <option value="1">★ 1+</option>
          <option value="2">★★ 2+</option>
          <option value="3">★★★ 3+</option>
          <option value="4">★★★★ 4+</option>
          <option value="5">★★★★★ 5</option>
        </select>
        <select id="filterTheme"><option value="">All Themes</option></select>
        <select id="filterQuality"><option value="">All Quality</option></select>
        <select id="filterSong"><option value="">All Songs</option></select>

        <span class="duration-label" id="durationLabel">0:00 – ∞</span>
        <div class="duration-slider" id="durationSlider">
          <div class="duration-track"><div class="duration-fill" id="durationFill"></div></div>
          <input type="range" id="durMinSlider" min="0" max="120" step="1" value="0">
          <input type="range" id="durMaxSlider" min="0" max="120" step="1" value="120">
        </div>

        <div class="tri-filter" data-filter="filterCollections">
          <div class="tri-buttons">
            <button class="tri-btn active" data-value="">Include</button>
            <button class="tri-btn" data-value="1">Only</button>
            <button class="tri-btn" data-value="0">Hide</button>
          </div>
        </div>
        <div class="tri-filter" data-filter="filterStarred">
          <div class="tri-buttons">
            <button class="tri-btn active" data-value="">All</button>
            <button class="tri-btn" data-value="1">Only</button>
            <button class="tri-btn" data-value="0">Not Faved</button>
          </div>
        </div>
        <div class="tri-filter" data-filter="filterHasNotes">
          <div class="tri-buttons">
            <button class="tri-btn active" data-value="">All</button>
            <button class="tri-btn" data-value="1">Has</button>
            <button class="tri-btn" data-value="0">None</button>
          </div>
        </div>
        <div class="tri-filter" data-filter="filterDuplicates">
          <div class="tri-buttons">
            <button class="tri-btn active" data-value="">All</button>
            <button class="tri-btn" data-value="1">Yes</button>
            <button class="tri-btn" data-value="0">No</button>
          </div>
        </div>
        <div class="tri-filter" data-filter="filterFlagged">
          <div class="tri-buttons">
            <button class="tri-btn active" data-value="">All</button>
            <button class="tri-btn" data-value="1">Yes</button>
            <button class="tri-btn" data-value="0">No</button>
          </div>
        </div>
        <div class="tri-filter" data-filter="filterTrashed">
          <div class="tri-buttons">
            <button class="tri-btn" data-value="">All</button>
            <button class="tri-btn" data-value="1">Only</button>
            <button class="tri-btn active" data-value="0">Hidden</button>
          </div>
        </div>
        <div class="tri-filter" data-filter="filterFailed">
          <div class="tri-buttons">
            <button class="tri-btn active" data-value="">All</button>
            <button class="tri-btn" data-value="1">Only</button>
            <button class="tri-btn" data-value="0">Hidden</button>
          </div>
        </div>
        <!-- AI scan outcome, derived from processing_error (see scanStatusOf).
             Four states rather than three, but the tri-filter markup is a
             generic "one active data-value" group, so it needs no new JS. -->
        <div class="tri-filter" data-filter="filterScanStatus">
          <div class="tri-buttons">
            <button class="tri-btn active" data-value="">All</button>
            <button class="tri-btn" data-value="success">Done</button>
            <button class="tri-btn" data-value="failed">Failed</button>
            <button class="tri-btn" data-value="unscanned">Unscanned</button>
          </div>
        </div>
        <!-- Folder watchers (player-lib/watchers-ui.js): files gone from disk,
             and files a watcher added that have not been seen yet. -->
        <div class="tri-filter" data-filter="filterMissing">
          <div class="tri-buttons">
            <button class="tri-btn active" data-value="">All</button>
            <button class="tri-btn" data-value="1">Only</button>
            <button class="tri-btn" data-value="0">Hide</button>
          </div>
        </div>
        <div class="tri-filter" data-filter="filterWatchNew">
          <div class="tri-buttons">
            <button class="tri-btn active" data-value="">All</button>
            <button class="tri-btn" data-value="1">Only</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 👤 Faces tab: the people home, or a person's header over their
         files (player-lib/faces-tab.js). -->
    <div class="faces-view" id="facesView" hidden></div>

    <!-- "N files missing from disk" — filled by settings.js when the cached
         server-side check comes back high; dismissible for the session. -->
    <div class="missing-banner" id="missingFilesBanner" style="display:none"></div>

    <!-- "Showing N selected files" — filters.js focus set, used by the
         migration report's "Show not migrated" button. -->
    <div class="focus-banner" id="focusFilterBar" style="display:none"></div>

    <!-- Results Info -->
    <div class="results-info">
      <div class="results-count">
        <!-- Modern look only: open / close the left filter rail (player-lib/filter-rail.js) -->
        <button type="button" class="rail-toggle-btn modern-only" id="railToggleBtn" aria-pressed="false"
                aria-controls="filterRail" title="Show or hide the filter panel"><span class="vi-w" data-vi="filter">☰ </span>Filters</button>
        <button class="search-collapse-btn" id="searchCollapseBtn" title="Show/hide search &amp; filters" aria-expanded="true"><span class="vi-w" data-vi="search">▲ </span>Search<span class="vi-w" data-vi="chevron"></span></button>
        <!-- Select page / Select all already carry the counts, so no separate
             "Showing N of M results" line: it said the same thing twice. -->
        <span class="results-select" id="resultsSelect"></span>
        <!-- Contextual actions: each shows only while the filter it belongs to
             is set (Trashed = Only, Scan = Failed/Unscanned). They sit in the
             same row as Select page / Select all and share its button height,
             so appearing never changes the row height. -->
        <button id="clearTrashBtn" class="rs-btn rs-btn-danger" style="display:none"
          onclick="clearTrash()" title="Permanently delete every file in the trash. This cannot be undone.">🗑 Empty trash</button>
        <button id="rescanFilteredBtn" class="rs-btn rs-btn-accent" style="display:none"
          onclick="rescanFiltered()"></button>
      </div>
      <div class="results-controls">
        <!-- Modern look only: card size as a slider (player-lib/layout-modern.js).
             Classic keeps Small / Medium / Large in Settings. -->
        <div class="card-size-control modern-only">
          <label for="cardSizeRange">Size</label>
          <input type="range" id="cardSizeRange" min="120" max="480" step="10" value="170"
                 title="Card size: drag for smaller or bigger tiles">
        </div>
        <!-- Modern look only: tiles or a table (player-lib/table-view.js) -->
        <div class="view-switch modern-only" id="viewSwitch" role="group" aria-label="Show as">
          <button type="button" class="view-switch-btn" data-view="grid" aria-pressed="true" title="Show as tiles"><span class="vi-w" data-vi="grid">▦ </span>Grid</button>
          <button type="button" class="view-switch-btn" data-view="table" aria-pressed="false" title="Show as a table"><span class="vi-w" data-vi="table">☰ </span>Table</button>
        </div>
        <button type="button" class="tv-columns-btn modern-only" id="tableColumnsBtn" hidden
                aria-haspopup="true" aria-expanded="false" title="Choose which columns the table shows">Columns ▾</button>
        <div class="sort-control">
          <label>Sort:</label>
          <select id="sortSelect">
            <option value="processed">Date added</option>
            <option value="name">Name</option>
            <option value="size">Size</option>
            <option value="duration">Duration</option>
            <option value="rating">Rating</option>
            <option value="views">Views</option>
            <option value="done">Finished most</option>
          </select>
          <button id="sortDirBtn" class="sort-dir-btn" title="Toggle most/least first">▼</button>
          <button id="favesFirstBtn" class="faves-first-btn" title="Favorites first (on top of any sort)" aria-label="Favorites first" aria-pressed="false"><span class="vi-w" data-vi="heart">🤍</span></button>
        </div>
        <!-- Modern look only: open / close the docked preview pane (player-lib/dock.js) -->
        <button type="button" class="dock-toggle-btn modern-only" id="dockToggleBtn" aria-pressed="false"
                title="Show or hide the preview pane"><span class="vi-w" data-vi="dock">▣ </span>Preview</button>
      </div>
    </div>

    <!-- Results -->
    <div class="results-grid" id="resultsGrid"></div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
  </main>

  <!-- Docked preview pane (Modern look only, player-lib/dock.js). Fixed to the
       right edge under the header; #mainContainer gets a matching right margin
       while it shows, so the grid shrinks instead of being covered. -->
  <aside class="library-dock" id="libraryDock" aria-label="Preview" hidden>
    <div class="dock-resizer" id="dockResizer" tabindex="0" role="separator" aria-orientation="vertical"
         aria-label="Resize the preview pane" title="Drag to resize"></div>
    <div class="dock-head">
      <span class="dock-head-title">Preview</span>
      <button type="button" class="dock-close" id="dockCloseBtn" title="Close the preview pane">✕</button>
    </div>
    <div class="dock-body" id="dockBody"></div>
  </aside>

  <!-- Left filter rail (Modern look only, player-lib/filter-rail.js). Fixed to
       the left edge under the header; #mainContainer gets a matching left
       margin while it shows. It is another view over #filterState: every
       control here writes the same elements the chips and the More sheet do. -->
  <aside class="filter-rail" id="filterRail" aria-label="Filters" hidden>
    <div class="rail-head">
      <span class="rail-head-title">Filters</span>
      <button type="button" class="rail-close" id="railCloseBtn" title="Hide the filter panel">✕</button>
    </div>
    <div class="rail-body" id="filterRailBody"></div>
  </aside>

  <!-- Editor (stack/grid mixes, songs browser, exports) — rendered by editor.js -->
  <main class="editor-container" id="editorContainer" style="display:none;"></main>

  <!-- Games (video games over the library) — rendered by games.js -->
  <main class="games-container" id="gamesContainer" style="display:none;"></main>

  <!-- Wall (full-bleed collage of the library) — rendered by wall.js -->
  <main class="wall-root" id="wallContainer" style="display:none;"></main>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modalTitle">Filename</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">Path copied to clipboard!</div>

  <!-- Media Player Overlay -->
  <div class="media-player-overlay" id="mediaPlayerOverlay">
    <div class="media-player-header">
      <div class="media-player-title" id="mediaPlayerTitle">filename.mp4</div>
      <div class="media-player-header-btns">
        <button class="media-player-minimize" onclick="minimizePlayer()" title="Minimize (Q)">🗕</button>
        <button class="media-player-close" onclick="closeMediaPlayer()">✕ Close</button>
      </div>
    </div>
    <div class="media-player-body">
      <div class="media-player-main">
        <div class="media-player-content" id="mediaPlayerContent"></div>
        <div class="media-player-controls" id="mediaPlayerControls"></div>
      </div>
      <div class="media-sidebar" id="mediaSidebar">
        <div class="media-sidebar-header">
          <h3 class="media-sidebar-title">Info & Notes</h3>
          <button class="media-sidebar-close" onclick="toggleSidebar()" title="Close sidebar (I)">✕</button>
        </div>
        <div class="media-sidebar-body" id="mediaSidebarBody"></div>
      </div>
    </div>
  </div>

  <!-- Media Info Overlay -->
  <div class="media-info-overlay" id="mediaInfoOverlay" onclick="closeMediaInfo()">
    <div class="media-info-content" id="mediaInfoContent" onclick="event.stopPropagation()"></div>
  </div>

  <!-- Mini Player: a floating picture in a corner, its controls fade in on
       hover (player-lib/player/mini-player.js, css/mini-player.css) -->
  <div class="mini-player" id="miniPlayer" role="region" aria-label="Mini player" data-corner="br" tabindex="-1">
    <div class="mini-player-media" id="miniPlayerMedia"></div>
    <!-- Audio has no picture: its art, or the type icon -->
    <div class="mini-audio-art" id="miniAudioArt" aria-hidden="true" hidden>
      <img class="mini-audio-img" id="miniAudioImg" alt="" draggable="false" hidden>
      <span class="mini-audio-icon"><span class="vi-w" data-vi="audio">🎵</span></span>
    </div>
    <div class="mini-pip-note" id="miniPipNote" hidden>Playing in picture-in-picture</div>
    <div class="mini-overlay" id="miniOverlay">
      <div class="mini-player-controls mini-top">
        <!-- While Stage is open (player-lib/stage-control.js): what Stage shows -->
        <span class="mini-stage-pill mini-stage-only" id="miniStagePill"><i aria-hidden="true"></i><span class="msp-word">On Stage</span></span>
        <div class="mini-vol" id="miniVol">
          <button type="button" class="mini-ctrl" id="miniMuteBtn" onclick="miniToggleMute()" title="Mute" aria-label="Mute"></button>
          <input type="range" class="mini-vol-slider" id="miniVolSlider" min="0" max="1" step="0.01" value="1"
                 oninput="miniSetVolume(this.value)" aria-label="Volume">
        </div>
        <!-- Up next (player-lib/up-next.js): opens its list above the box -->
        <button type="button" class="mini-ctrl mini-upnext" id="miniUpNextBtn" onclick="UpNext.togglePopover()" title="Up next" aria-label="Up next" aria-haspopup="dialog" aria-expanded="false"><span class="vi-w" data-vi="queue">☰</span><span class="mini-un-label">Up next</span><span class="mini-un-badge" id="miniUpNextCount" hidden>0</span></button>
        <button type="button" class="mini-ctrl mini-stage-only" id="miniRepeatBtn" onclick="cycleRepeatMode()" title="Repeat" aria-label="Repeat"><span class="vi-w" data-vi="repeat">🔁</span></button>
        <button type="button" class="mini-ctrl mini-stage-only" id="miniHoldBtn" onclick="StageControl.toggleHold()" title="Hold: Stage goes black and silent (H)" aria-label="Hold" aria-pressed="false"><span class="vi-w" data-vi="hold">⬛</span></button>
        <button type="button" class="mini-ctrl mini-stage-hide" id="miniPipBtn" onclick="miniTogglePip()" title="Pop out over other windows" aria-label="Pop out over other windows" hidden><span class="vi-w" data-vi="pip">⧉</span></button>
        <!-- Stage: the window you share in Discord. Click opens or closes it, right-click has the rest -->
        <button type="button" class="mini-ctrl mini-stage-btn" id="miniStageBtn" onclick="StageControl.stageButton(event)" oncontextmenu="StageControl.menu(event)" title="Open Stage, the window you share in Discord" aria-label="Open Stage"><span class="vi-w" data-vi="stage">📺</span></button>
        <button type="button" class="mini-ctrl mini-stage-hide" onclick="maximizePlayer()" title="Back to the full player (Q)" aria-label="Back to the full player"><span class="vi-w" data-vi="expand">⤢︎</span></button>
        <button type="button" class="mini-ctrl mini-close mini-stage-hide" onclick="closeMiniPlayer()" title="Close (Esc)" aria-label="Close the mini player"><span class="vi-w" data-vi="close">✕</span></button>
      </div>
      <div class="mini-center">
        <button type="button" class="mini-ctrl mini-round mini-file" data-mini-act="prev" title="Previous file (P)" aria-label="Previous file"><span class="vi-w" data-vi="prev-file">⏮︎</span></button>
        <button type="button" class="mini-ctrl mini-round" data-mini-act="back" title="Back 10 seconds" aria-label="Back 10 seconds"><span class="vi-w" data-vi="rewind">⏪︎</span></button>
        <button type="button" class="mini-ctrl mini-round mini-big" id="miniPlayPause" data-mini-act="play" title="Play or pause (Space)" aria-label="Pause"></button>
        <button type="button" class="mini-ctrl mini-round mini-fwd" data-mini-act="fwd" title="Forward 10 seconds" aria-label="Forward 10 seconds"><span class="vi-w" data-vi="rewind">⏩︎</span></button>
        <button type="button" class="mini-ctrl mini-round mini-file" data-mini-act="next" title="Next file (N)" aria-label="Next file"><span class="vi-w" data-vi="next-file">⏭︎</span></button>
      </div>
      <div class="mini-bottom">
        <div class="mini-seek" id="miniSeek" title="Click or drag to seek">
          <div class="mini-seek-track" id="miniSeekTrack"><div class="mini-seek-fill" id="miniSeekFill"></div></div>
        </div>
        <div class="mini-meta">
          <span class="mini-player-title" id="miniPlayerTitle">filename.mp4</span>
          <span class="mini-time" id="miniTime">0:00 / 0:00</span>
        </div>
      </div>
    </div>
    <div class="mini-resize" id="miniResize" title="Drag to resize" aria-hidden="true"></div>
  </div>

  <!-- Jump back to the top of the grid (continuous layout only) -->
  <button type="button" class="scroll-top-pill" id="scrollTopPill" tabindex="-1"
          onclick="scrollLibraryToTop({ smooth: true })"
          title="Back to the top of the library"
          aria-label="Back to the top of the library">
    <span class="stp-text">Top</span><span class="stp-icon" aria-hidden="true">↑</span>
